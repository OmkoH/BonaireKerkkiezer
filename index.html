<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bonaire Kerkkiezer</title>
  <meta name="description" content="Vind een christelijke kerk op Bonaire: overzicht van kerken, denominaties, diensttijden en talen.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛪</text></svg>">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <div>
        <h1 data-i18n="title">Bonaire Kerkkiezer</h1>
        <p class="tagline" data-i18n="tagline"></p>
      </div>
      <nav class="lang-switch" aria-label="Taal / Language / Idioma">
        <button type="button" data-lang="nl">NL</button>
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="pap">PAP</button>
      </nav>
    </div>
  </header>

  <main class="wrap layout">
    <aside class="filters" aria-labelledby="filters-title">
      <details id="filters-details" open>
        <summary><h2 id="filters-title" data-i18n="filters">Filters</h2></summary>

        <input type="search" id="q" class="search" autocomplete="off">

        <fieldset>
          <legend data-i18n="day"></legend>
          <div class="chips" id="f-day"></div>
        </fieldset>

        <fieldset>
          <legend data-i18n="time"></legend>
          <div class="chips" id="f-period"></div>
        </fieldset>

        <fieldset>
          <legend data-i18n="serviceLang"></legend>
          <div class="chips" id="f-lang"></div>
          <label class="check"><input type="checkbox" id="f-translation"> <span data-i18n="includeTranslation"></span></label>
        </fieldset>

        <fieldset>
          <legend data-i18n="denomination"></legend>
          <div class="chips" id="f-denom"></div>
        </fieldset>

        <fieldset>
          <legend data-i18n="place"></legend>
          <select id="f-place"></select>
        </fieldset>

        <label class="check"><input type="checkbox" id="f-other"> <span data-i18n="includeOther"></span></label>

        <button type="button" id="reset" class="btn-link" data-i18n="reset"></button>
      </details>
    </aside>

    <section class="results" aria-live="polite">
      <div class="results-bar">
        <p id="count" class="count"></p>
        <div class="tabs" role="tablist">
          <button type="button" role="tab" data-view="list" data-i18n="viewList"></button>
          <button type="button" role="tab" data-view="schedule" data-i18n="viewSchedule"></button>
          <button type="button" role="tab" data-view="map" data-i18n="viewMap"></button>
        </div>
      </div>

      <div id="view-list" class="view"></div>
      <div id="view-schedule" class="view" hidden></div>
      <div id="view-map" class="view" hidden>
        <div id="map"></div>
        <p class="muted small" data-i18n="mapNote"></p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p id="disclaimer"></p>
      <p><a href="https://github.com/OmkoH/BonaireKerkkiezer/issues" data-i18n="correction"></a></p>
    </div>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="data/churches.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
